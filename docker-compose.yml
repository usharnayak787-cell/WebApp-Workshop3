services:
  backend:
    build:
      context: ./backend
    container_name: task-management-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://unicourt_user:admin@host.docker.internal:5438/uc_master
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: task-management-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend